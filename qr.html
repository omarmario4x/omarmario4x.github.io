<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07131d">
<title>QR Code Generator | Omar Yasser</title>
<meta name="description" content="Turn any link or text into a QR code and download it as an image.">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:30px 18px;display:grid;place-items:center;background:radial-gradient(circle at top,#12384a,#07131d 55%,#050b11);font-family:Arial,sans-serif;color:#f5fbff}
main{width:min(100%,460px);text-align:center}
.back{display:inline-flex;align-items:center;gap:6px;color:#9bb0bd;text-decoration:none;font-size:12px;letter-spacing:2px;margin-bottom:18px}.back:hover{color:#54d9f2}
.mark{width:68px;height:68px;margin:0 auto 18px;border:1px solid #54d9f277;border-radius:22px;display:grid;place-items:center;color:#54d9f2;font-size:25px;font-weight:800}
h1{font-size:27px;letter-spacing:2px;margin:0}.sub{color:#54d9f2;font-size:12px;letter-spacing:4px;margin:10px 0 8px;font-weight:700}.note{color:#9bb0bd;font-size:14px;margin:0 0 24px}
.card{background:linear-gradient(110deg,#122b3a,#0d1d28);border:1px solid #54d9f233;border-radius:18px;padding:18px;text-align:left}
label{display:block;font-size:11px;letter-spacing:2px;color:#9bb0bd;font-weight:700;margin:0 0 8px}
textarea,select{width:100%;font:inherit;color:#f5fbff;background:#07131d;border:1px solid #54d9f244;border-radius:12px;padding:12px 14px;outline:none}
textarea{min-height:92px;resize:vertical;font-size:15px;line-height:1.4}textarea:focus,select:focus{border-color:#54d9f2;box-shadow:0 0 0 3px #54d9f222}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.color{display:flex;align-items:center;gap:10px;background:#07131d;border:1px solid #54d9f244;border-radius:12px;padding:6px 10px;font-size:13px;color:#cfe3ec}
input[type=color]{width:34px;height:30px;border:0;padding:0;background:none;cursor:pointer}
.meta{display:flex;justify-content:space-between;font-size:11px;color:#718895;margin-top:6px}
.preview{margin:18px auto 0;width:100%;aspect-ratio:1;max-width:280px;border-radius:16px;display:grid;place-items:center;background:#07131d;border:1px dashed #54d9f244;overflow:hidden}
.preview canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.empty{color:#718895;font-size:13px;padding:20px;text-align:center}
.error{color:#ff8a8a;font-size:13px;margin-top:10px;text-align:center;min-height:1em}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
button{font:inherit;font-weight:700;letter-spacing:.8px;font-size:14px;padding:14px;border-radius:13px;cursor:pointer;border:1px solid #54d9f2;transition:transform .1s,opacity .2s}
button:active{transform:scale(.98)}button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:#54d9f2;color:#06202b}.ghost{background:transparent;color:#54d9f2}
footer{margin-top:28px;color:#718895;font-size:10px;letter-spacing:2px}
</style></head>
<body><main>
<a class="back" href="/">← BACK</a>
<div class="mark">QR</div><h1>QR GENERATOR</h1><div class="sub">LINK · TEXT · IMAGE</div>
<p class="note">Type a link or any text, then download your QR code</p>

<section class="card">
  <label for="qr-text">LINK OR TEXT</label>
  <textarea id="qr-text" placeholder="https://example.com" maxlength="1200" dir="auto" autofocus></textarea>
  <div class="meta"><span>Works with Arabic &amp; emoji too</span><span id="count">0 / 1200</span></div>

  <div class="row">
    <div><label for="qr-size">SIZE</label>
      <select id="qr-size"><option value="256">256 px</option><option value="512" selected>512 px</option><option value="1024">1024 px</option><option value="2048">2048 px</option></select></div>
    <div><label for="qr-ecc">ERROR CORRECTION</label>
      <select id="qr-ecc"><option value="L">Low</option><option value="M" selected>Medium</option><option value="Q">High</option><option value="H">Max</option></select></div>
  </div>

  <div class="colors">
    <label class="color"><input type="color" id="qr-fg" value="#000000"> Foreground</label>
    <label class="color"><input type="color" id="qr-bg" value="#ffffff"> Background</label>
  </div>

  <div class="preview" id="preview"><div class="empty">Your QR code appears here</div></div>
  <div class="error" id="error" role="alert"></div>

  <div class="actions">
    <button class="primary" id="dl-png" disabled>DOWNLOAD PNG</button>
    <button class="ghost" id="dl-svg" disabled>DOWNLOAD SVG</button>
  </div>
</section>
<footer>GENERATED IN YOUR BROWSER · NOTHING IS UPLOADED</footer>
</main>

<script src="/qrcode.js"></script>
<script>
(function(){
  qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
  var $ = function(id){ return document.getElementById(id); };
  var text = $('qr-text'), size = $('qr-size'), ecc = $('qr-ecc'), fg = $('qr-fg'), bg = $('qr-bg');
  var preview = $('preview'), error = $('error'), count = $('count'), btnPng = $('dl-png'), btnSvg = $('dl-svg');
  var QUIET = 4; // quiet-zone modules around the code
  var current = null;

  // Pre-fill from ?text= so the page can be shared with content
  var initial = new URLSearchParams(location.search).get('text');
  if (initial) text.value = initial;

  function build(value){
    var qr = qrcode(0, ecc.value); // 0 = pick the smallest version that fits
    qr.addData(value, 'Byte');
    qr.make();
    return qr;
  }

  function drawCanvas(qr, px){
    var n = qr.getModuleCount(), total = n + QUIET * 2;
    var cell = Math.max(1, Math.floor(px / total));
    var dim = cell * total, offset = Math.floor((px - dim) / 2);
    var c = document.createElement('canvas');
    c.width = c.height = px;
    var ctx = c.getContext('2d');
    ctx.fillStyle = bg.value; ctx.fillRect(0, 0, px, px);
    ctx.fillStyle = fg.value;
    for (var r = 0; r < n; r++) for (var col = 0; col < n; col++)
      if (qr.isDark(r, col)) ctx.fillRect(offset + (col + QUIET) * cell, offset + (r + QUIET) * cell, cell, cell);
    return c;
  }

  function toSvg(qr){
    var n = qr.getModuleCount(), total = n + QUIET * 2, d = '';
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++)
      if (qr.isDark(r, c)) d += 'M' + (c + QUIET) + ' ' + (r + QUIET) + 'h1v1h-1z';
    return '<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + total + ' ' + total +
      '" width="' + size.value + '" height="' + size.value + '" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="' + bg.value +
      '"/><path fill="' + fg.value + '" d="' + d + '"/></svg>';
  }

  function render(){
    var value = text.value;
    count.textContent = value.length + ' / 1200';
    error.textContent = '';
    current = null;
    if (!value.trim()) {
      preview.innerHTML = '<div class="empty">Your QR code appears here</div>';
      btnPng.disabled = btnSvg.disabled = true;
      return;
    }
    try { current = build(value); }
    catch (e) {
      preview.innerHTML = '<div class="empty">—</div>';
      error.textContent = 'Text is too long for a QR code. Try shortening it or lowering error correction.';
      btnPng.disabled = btnSvg.disabled = true;
      return;
    }
    preview.innerHTML = '';
    preview.appendChild(drawCanvas(current, 560));
    btnPng.disabled = btnSvg.disabled = false;
  }

  function fileName(ext){ return 'qr-code-' + new Date().toISOString().slice(0, 10) + '.' + ext; }

  function download(blob, name){
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  btnPng.addEventListener('click', function(){
    if (!current) return;
    drawCanvas(current, parseInt(size.value, 10)).toBlob(function(blob){ download(blob, fileName('png')); }, 'image/png');
  });
  btnSvg.addEventListener('click', function(){
    if (!current) return;
    download(new Blob([toSvg(current)], { type: 'image/svg+xml' }), fileName('svg'));
  });

  var t;
  text.addEventListener('input', function(){ clearTimeout(t); t = setTimeout(render, 120); });
  [size, ecc, fg, bg].forEach(function(el){ el.addEventListener('input', render); el.addEventListener('change', render); });
  render();
})();
</script>
</body></html>
